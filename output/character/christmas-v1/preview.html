<!doctype html>
<html lang="id"><meta charset="utf-8"><title>Penguin Natal — preview revisi</title>
<style>body{font:16px system-ui;background:#eee8dd;color:#302c29;margin:24px}main{max-width:800px;margin:auto}canvas{width:min(100%,600px);background:#faf8f2;border-radius:20px;display:block;margin:20px 0}button,select,input{font:inherit;padding:8px}label{margin:8px;display:inline-block}</style>
<main><h1>Penguin Natal</h1><p>Preview revisi ekspresi, tali/kail dan penempatan di atas es-air asli.</p>
<select id="action" aria-label="Gerakan"></select><button id="play">Jeda</button><label>FPS <input id="fps" type="number" value="12" min="1" max="30"></label><label>Latar <input id="bg" type="color" value="#faf8f2"></label>
<canvas id="canvas" width="600" height="600"></canvas><p id="status"></p><p>Preview mandiri. Kail terlihat sebelum lempar dan saat diangkat; ketika menarik, kail berada dalam air.</p></main>
<script src="registration.js"></script><script>
const names=['arrival-idle','cast','catch','deposit','distraction-lights','distraction-ice','distraction-snow'];
const labels=['Muncul / idle','Lempar pancing','Tarik tangkapan','Masukkan ke ember','Distraction: lampu','Distraction: es','Distraction: salju'];
const select=document.querySelector('#action'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
names.forEach((name,i)=>select.add(new Option(labels[i],name)));
const ice=new Image();ice.src='environment/ice-water.png';
const bucketArt=new Image();bucketArt.src='environment/bucket.png';
const catches=new Image();catches.src='environment/catches.png';
let sprite=new Image(),ready=false,playing=true,start=performance.now(),frame=0,elapsed=0;
function load(){ready=false;const next=new Image();next.onload=()=>{sprite=next;ready=true;start=performance.now();frame=0;elapsed=0};next.onerror=()=>status.textContent='Atlas gagal dimuat: '+select.value;next.src='atlases/'+select.value+'.png'}
select.onchange=load;document.querySelector('#fps').onchange=()=>start=performance.now();
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Jeda':'Putar';start=performance.now()-elapsed};
document.querySelector('#bg').oninput=e=>canvas.style.background=e.target.value;
function hook(x,y){ctx.strokeStyle='#514840';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.moveTo(x,y+2);ctx.lineTo(x,y+12);ctx.bezierCurveTo(x,y+24,x-14,y+23,x-12,y+13);ctx.lineTo(x-8,y+17);ctx.stroke()}
function draw(now){
 if(ready){const fps=Math.max(1,Math.min(30,Number(document.querySelector('#fps').value)||12));if(playing)elapsed=now-start;
 const action=select.value,raw=elapsed/1000*fps,hold=action==='catch',p=hold?Math.min(1,raw/12):(raw%12)/12;frame=hold?Math.min(11,Math.floor(raw)):Math.floor(raw)%12;
 const w=sprite.naturalWidth/4,h=sprite.naturalHeight/3,reg=window.registration?.[action],a=reg?.frames[frame]||{footX:w*.55,footY:h*.84};
 const scale=350/(reg?.referenceHeight||h),jump=action==='distraction-ice'?-50*Math.sin(Math.PI*Math.max(0,Math.min(1,(p-.3)/.45))):0;
 const x=325-a.footX*scale,y=493-a.footY*scale+jump;
 ctx.clearRect(0,0,600,600);if(ice.complete&&ice.naturalWidth)ctx.drawImage(ice,30,415,540,180);
 ctx.drawImage(sprite,(frame%4)*w,Math.floor(frame/4)*h,w,h,x,y,w*scale,h*scale);if(bucketArt.complete&&bucketArt.naturalWidth)ctx.drawImage(bucketArt,440,443,64,64);
 if(a.rodTip){const tip={x:x+a.rodTip[0]*scale,y:y+a.rodTip[1]*scale};let end={x:135,y:525};let visible=false;
  if(action==='cast'&&p<.35){end={x:tip.x-8,y:tip.y+115};visible=true}
  if(action==='catch'&&p>.7){const q=(p-.7)/.3;end={x:tip.x,y:525+(tip.y+95-525)*q};visible=q>.1}
  if(action==='deposit'){const q=Math.min(1,p/.7);end=q<.5?{x:135+(472-135)*q*2,y:85}:{x:472,y:85+(445-85)*(q-.5)*2};visible=p<.75}
  ctx.strokeStyle='#625347';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(tip.x,tip.y);ctx.lineTo(end.x,end.y);ctx.stroke();if(visible)hook(end.x,end.y);
  if(visible&&(action==='catch'||action==='deposit')&&catches.complete&&catches.naturalWidth)ctx.drawImage(catches,0,0,catches.naturalWidth/4,catches.naturalHeight,end.x-20,end.y+12,40,40);
 }
 status.textContent=labels[names.indexOf(action)]+' · frame '+(frame+1)+'/12';
 }requestAnimationFrame(draw)
}load();requestAnimationFrame(draw);
</script></html>
